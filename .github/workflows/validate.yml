name: Validate plugin
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - name: Run test suite
        run: node --test
      - name: alfred_ MCP endpoint is reachable
        run: node scripts/smoke-test-mcp-endpoint.mjs
