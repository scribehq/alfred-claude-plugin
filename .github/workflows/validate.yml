name: Validate plugin
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - name: .mcp.json points at the alfred_ server
        run: |
          node -e '
            const m = require("./.mcp.json");
            if (m.alfred?.type !== "http" || m.alfred?.url !== "https://get-alfred.ai/api/mcp") { console.error(".mcp.json drifted", m); process.exit(1); }
            console.log("ok", m.alfred.url);
          '
